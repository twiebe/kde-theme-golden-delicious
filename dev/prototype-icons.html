<!doctype html>
<!-- PROTOTYPE, throwaway: icon style variants for Golden Gate. Answers "which
     rough style should our own symbolic icons have?" Switch with ?variant=
     or the bar at the bottom (arrow keys work too). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Style Prototype</title>
<style>
  :root { --win:#2B2B2D; --view:#1E1E1E; --text:#E6E6E6; --dim:#8E8E93; --accent:#0A84FF; }
  * { box-sizing:border-box; }
  body { margin:0; background:#4a3a6a linear-gradient(135deg,#3b2a5a,#7a4a6a 60%,#c08050); color:var(--text);
         font:14px/1.3 "Noto Sans", system-ui, sans-serif; min-height:100vh; padding:24px 16px 96px; }
  h1 { font-size:18px; margin:0 0 4px; } p.note { margin:0 0 16px; color:#ddd; max-width:70ch; }
  .win { background:var(--win); border-radius:16px 16px 0 0; max-width:980px; margin:0 auto 24px;
         box-shadow:0 10px 30px rgba(0,0,0,.35); overflow:hidden; }
  .tb { display:flex; gap:14px; align-items:center; padding:12px 16px; }
  .tb .lights { display:flex; gap:10px; margin-right:12px; } .tb .lights i { width:14px; height:14px; border-radius:50%; display:block; }
  .main { display:flex; min-height:330px; }
  .side { width:220px; padding:4px 8px 12px; } .side h3 { font-size:12px; color:var(--dim); font-weight:normal; margin:12px 8px 4px; }
  .row { display:flex; gap:10px; align-items:center; padding:5px 8px; border-radius:8px; }
  .row.sel { background:rgba(255,255,255,.10); }
  .view { flex:1; background:var(--view); padding:16px; display:flex; flex-direction:column; gap:18px; }
  .sizes { display:flex; gap:28px; align-items:flex-end; flex-wrap:wrap; }
  .sizes figure { margin:0; display:flex; flex-direction:column; gap:6px; }
  .sizes figcaption, .big figcaption { font-size:11px; color:var(--dim); }
  .strip { display:flex; gap:10px; flex-wrap:wrap; }
  .big { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; }
  .big figure { margin:0; background:#262628; border-radius:10px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .accent { color:var(--accent); }
  svg.i, img.i { display:block; flex:none; }
  #bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:4px;
         background:#fff; color:#111; border-radius:999px; padding:6px; box-shadow:0 6px 24px rgba(0,0,0,.45); font-weight:600; }
  #bar button { border:0; background:#111; color:#fff; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; }
  #bar span { padding:0 14px; min-width:220px; text-align:center; }
  @media (max-width:640px) { .side { width:160px; } #bar span { min-width:150px; font-size:13px; } }
</style>
</head>
<body>
<h1>Golden Gate icons: rough style</h1>
<p class="note" id="desc"></p>
<div class="win">
  <div class="tb">
    <div class="lights"><i style="background:#F75143"></i><i style="background:#FBB600"></i><i style="background:#16C22A"></i></div>
    <span data-icon="search" data-size="22"></span><span data-icon="gear" data-size="22"></span>
    <span style="color:var(--dim)">Toolbar, 22 px</span>
  </div>
  <div class="main">
    <div class="side" id="side"></div>
    <div class="view">
      <div class="sizes" id="sizes"></div>
      <div class="big" id="big"></div>
    </div>
  </div>
</div>
<div id="bar"><button id="prev" aria-label="previous">&#8592;</button><span id="label"></span><button id="next" aria-label="next">&#8594;</button></div>

// Icons on a 24 grid. body: closed shapes (filled in the fill style),
// cut: details inside the body (knocked out in the fill style), extra: always lines.

              cut:["M10 20.5 V15.5 a1 1 0 0 1 1 -1 H13 a1 1 0 0 1 1 1 V20.5"] },
  desktop:  { breeze:"user-desktop", label:"Desktop",

              cut:["M3.5 10 H20.5"] },
  music:    { breeze:"folder-music", label:"Music",
              body:["M6.75 15 a2.5 2.5 0 1 1 0 5 a2.5 2.5 0 1 1 0 -5 Z","M16.75 13 a2.5 2.5 0 1 1 0 5 a2.5 2.5 0 1 1 0 -5 Z"],

// Rounded 8-tooth gear outline.
function gearPath(){
  const n=8, ro=9, ri=6.9, pts=[];
  for(let i=0;i<n*4;i++){ const a=(i/(n*4))*2*Math.PI - Math.PI/2 + Math.PI/(n*4); const r=(i%4<2)?ro:ri;
    pts.push([12+r*Math.cos(a),12+r*Math.sin(a)]); }
  return "M"+pts.map(p=>p.map(v=>v.toFixed(2)).join(" ")).join(" L")+" Z";
}
const VARIANTS = [
  { key:"0", name:"Breeze (today)", desc:"Reference: stock Breeze Dark, 1 px lines, square corners." },
  { key:"A", name:"Line", desc:"SF-style outline: 1.6 px round-capped strokes, generous corner radii, open details. Closest to SF Symbols regular." },
  { key:"B", name:"Fill", desc:"Solid shapes with knocked-out details, softened by a hairline round stroke. Like SF Symbols .fill: heavy, very legible at 16 px." },
  { key:"C", name:"Duotone", desc:"Outline as A plus the body filled at 30 %. Keeps the line look but adds mass; recolours with one class (opacity does the second tone)." },
  { key:"D", name:"Bold line", desc:"Like A but 2.1 px strokes and slightly shrunk shapes: chunkier, friendlier, closer to iOS tab bar icons." },
];
const SW = { A:1.6, C:1.6, D:2.1 };
function svg(name, v, size){
  const ic = ICONS[name], body = ic.body.map(d=>d==="GEAR"?gearPath():d);
  const lines = d => `<path d="${d}" fill="none" stroke="currentColor" stroke-width="${SW[v]}" stroke-linecap="round" stroke-linejoin="round"/>`;
  let inner = "";
  if (v==="B") {
    const id = "m"+name+Math.random().toString(36).slice(2,7);
    const cut = (ic.cut||[]).map(d=>`<path d="${d}" fill="${d.includes(" Z")?"#000":"none"}" stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
    inner = `<defs><mask id="${id}"><rect width="24" height="24" fill="#fff"/>${cut}</mask></defs>`+
      `<g mask="url(#${id})">${body.map(d=>`<path d="${d}" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>`).join("")}</g>`+
      (ic.extra||[]).map(d=>`<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  } else {
    const t = v==="D" ? ` transform="translate(12 12) scale(.92) translate(-12 -12)"` : "";
    const fill = v==="C" ? body.map(d=>`<path d="${d}" fill="currentColor" fill-opacity=".3"/>`).join("") : "";
    const cut = (ic.cut||[]).filter(()=>!ic.cutFillOnly).map(lines).join("");
    inner = `<g${t}>${fill}${body.map(lines).join("")}${cut}${(ic.extra||[]).map(lines).join("")}</g>`;
  }
  return `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24">${inner}</svg>`;
}
function icon(name, v, size){
  if (v==="0") return `<img class="i" width="${size}" height="${size}" src="${BREEZE[ICONS[name].breeze]}" alt="">`;
  return svg(name, v, size);
}
function render(v){
  const meta = VARIANTS.find(x=>x.key===v) || VARIANTS[0];
  document.getElementById("desc").textContent = meta.desc;
  document.getElementById("label").textContent = `${meta.key} (${meta.name})`;
  const places = ["home","desktop","document","download","folder","music","picture","video","trash"];
  document.getElementById("side").innerHTML =
    `<h3>Places</h3>` + places.map((n,i)=>`<div class="row${i===0?" sel":""}"><span class="accent">${icon(n,v,16)}</span>${ICONS[n].label}</div>`).join("") +
    `<h3>Remote</h3><div class="row"><span class="accent">${icon("network",v,16)}</span>Network</div>`;
  document.querySelectorAll("[data-icon]").forEach(el=>el.innerHTML=icon(el.dataset.icon,v,+el.dataset.size));
  const all = Object.keys(ICONS);
  document.getElementById("sizes").innerHTML = [16,22,24,32].map(s=>
    `<figure><div class="strip">${all.map(n=>icon(n,v,s)).join("")}</div><figcaption>${s} px${s===32?" (= 16 px at 200 %)":""}</figcaption></figure>`).join("");
  document.getElementById("big").innerHTML = all.map(n=>`<figure>${icon(n,v,72)}<figcaption>${n}</figcaption></figure>`).join("");
}
const keys = VARIANTS.map(x=>x.key);
function go(d){ const p=new URLSearchParams(location.search); const cur=keys.indexOf(p.get("variant")||"0");
  const nx=keys[(cur+d+keys.length)%keys.length]; p.set("variant",nx); history.replaceState(null,"","?"+p); render(nx); }
document.getElementById("prev").onclick=()=>go(-1); document.getElementById("next").onclick=()=>go(1);
addEventListener("keydown",e=>{ if(e.target.closest("input,textarea,[contenteditable]")) return;
  if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1); });
render(new URLSearchParams(location.search).get("variant")||"0");
</script>
